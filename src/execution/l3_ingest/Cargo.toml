[package]
name = "l3_ingest"
version = "0.1.0"
edition = "2021"

[lib]
name = "l3_ingest"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
bytemuck = { version = "1.14", features = ["derive"] }

version: '3.8'

services:
  elite-dashboard:
    build: .
    ports:
      - "1420:1420" # Frontend
      - "3000:3000" # Backend
    environment:
      - LIVE_MODE=true
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET=${BINANCE_SECRET}
    volumes:
      - ./l3_market_data.bin:/app/l3_market_data.bin # Persist Ring Buffer
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
